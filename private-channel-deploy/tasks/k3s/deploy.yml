---
# Deploy: the app chart. Checked here, not in preflight, so a same-host migration can
# bring up k3s and the databases while compose still holds 8899 and 8903.
- name: Read what listens on the public ports
  become: true
  ansible.builtin.shell: ss -Hltn '( sport = :{{ gateway_port }} or sport = :{{ auth_port }} )'
  register: _k3s_ports
  changed_when: false
  check_mode: false

# ServiceLB publishes through iptables, not a listening socket, so a listener is foreign.
- name: Refuse when something else holds the gateway or auth port
  ansible.builtin.assert:
    that: _k3s_ports.stdout | trim | length == 0
    fail_msg: |
      Something listens on {{ gateway_port }} or {{ auth_port }} on {{ inventory_hostname }}:
      {{ _k3s_ports.stdout }}
      A compose stack still running? Stop it first (migration: k3s.yml -e k3s_stop_after=database runs while it is up).

# Without helm-diff, kubernetes.core.helm upgrades only when values or the chart version
# change. The chart's own hash as a value makes any template or file change upgrade too.
- name: Hash the private-channel chart
  delegate_to: localhost
  run_once: true
  ansible.builtin.shell: cd "{{ repo_root }}/charts/private-channel" && find . -type f -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -c1-16
  register: _k3s_chart_sum
  changed_when: false
  check_mode: false

- name: Install or upgrade the app release
  delegate_to: localhost
  run_once: true
  kubernetes.core.helm:
    kubeconfig: "{{ pc_kubeconfig }}"
    name: private-channel
    chart_ref: "{{ repo_root }}/charts/private-channel"
    release_namespace: "{{ k3s_namespace }}"
    values_files: [ "{{ pc_tmp }}/values.generated.yaml" ]
    release_values: { chartChecksum: "{{ _k3s_chart_sum.stdout }}" }
    # No --wait: a StatefulSet pod stuck on a bad revision is replaced below, then the
    # rollouts are awaited. The pre-upgrade auth-migrate hook is still awaited.
    wait: false
    timeout: "{{ k3s_helm_timeout }}"
    # Never auto-roll back: a DB-adjacent change must stay for a human to look at.
    atomic: false

# down-k3s.yml scaled the app to 0 and helm does not touch an unchanged release.
- name: Restore the replicas a down recorded
  delegate_to: localhost
  run_once: true
  ansible.builtin.shell: |
    set -eu
    kubectl -n {{ k3s_namespace }} get deployment,statefulset -l app.kubernetes.io/part-of=private-channel \
      -o jsonpath='{range .items[*]}{.kind}/{.metadata.name} {.metadata.annotations.private-channel\.io/replicas-before-down}{"\n"}{end}' \
      | while read -r w n; do
        [ -n "${n:-}" ] || continue
        kubectl -n {{ k3s_namespace }} scale "$w" --replicas="$n" >/dev/null
        kubectl -n {{ k3s_namespace }} annotate "$w" private-channel.io/replicas-before-down- >/dev/null
        echo "restored $w to $n"
      done
  environment:
    KUBECONFIG: "{{ pc_kubeconfig }}"
  register: _k3s_restore
  changed_when: _k3s_restore.stdout | length > 0

# OrderedReady never replaces a pod that is not Ready (forced rollback), so after a bad
# release a redeploy deletes such pods still on an old revision; they come back on the new one.
- name: Replace StatefulSet pods stuck on an old revision
  delegate_to: localhost
  run_once: true
  ansible.builtin.shell: |
    set -eu
    for s in $(kubectl -n {{ k3s_namespace }} get statefulset -l app.kubernetes.io/part-of=private-channel -o name); do
      kubectl -n {{ k3s_namespace }} wait "$s" --for=jsonpath='{.status.observedGeneration}'="$(kubectl -n {{ k3s_namespace }} get "$s" -o jsonpath='{.metadata.generation}')" --timeout=60s >/dev/null
      upd="$(kubectl -n {{ k3s_namespace }} get "$s" -o jsonpath='{.status.updateRevision}')"
      kubectl -n {{ k3s_namespace }} get pods -l app.kubernetes.io/part-of=private-channel \
        -o jsonpath='{range .items[*]}{.metadata.name} {.metadata.ownerReferences[0].name} {.metadata.labels.controller-revision-hash} {.status.conditions[?(@.type=="Ready")].status}{"\n"}{end}' \
        | while read -r pod owner rev ready; do
          [ "$owner" = "${s#*/}" ] && [ "$rev" != "$upd" ] && [ "$ready" != True ] || continue
          kubectl -n {{ k3s_namespace }} delete pod "$pod" --wait=false >/dev/null
          echo "replaced $pod (was on $rev, not Ready)"
        done
    done
  environment:
    KUBECONFIG: "{{ pc_kubeconfig }}"
  register: _k3s_stuck
  changed_when: _k3s_stuck.stdout | length > 0

- name: List the workloads
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s_info:
    kubeconfig: "{{ pc_kubeconfig }}"
    kind: "{{ item }}"
    namespace: "{{ k3s_namespace }}"
    label_selectors: [ app.kubernetes.io/part-of=private-channel ]
  loop: [ Deployment, StatefulSet ]
  register: _k3s_workloads

- name: Wait for every rollout to finish
  delegate_to: localhost
  run_once: true
  ansible.builtin.command:
    argv: [ kubectl, -n, "{{ k3s_namespace }}", rollout, status, "{{ item }}", --timeout=10m ]
  environment:
    KUBECONFIG: "{{ pc_kubeconfig }}"
  loop: >-
    {{ _k3s_workloads.results | map(attribute='resources') | flatten
       | map(attribute='kind') | map('lower')
       | zip(_k3s_workloads.results | map(attribute='resources') | flatten | map(attribute='metadata.name'))
       | map('join', '/') | list }}
  changed_when: false

# A restarted dependency (the validator on a reset-flag change) can leave a worker
# NotReady after its rollout finished; health and sanity run only once all are Ready.
- name: Wait for every app pod to be Ready
  delegate_to: localhost
  run_once: true
  ansible.builtin.command:
    argv: [ kubectl, -n, "{{ k3s_namespace }}", wait, --for=condition=Ready, pod,
            -l, "app.kubernetes.io/part-of=private-channel,!job-name", --timeout=10m ]
  environment:
    KUBECONFIG: "{{ pc_kubeconfig }}"
  changed_when: false

# The next deploy reads the instance from here, as compose reads the previous .env.
- name: Record the deploy state
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    kubeconfig: "{{ pc_kubeconfig }}"
    state: present
    force: true
    definition:
      apiVersion: v1
      kind: ConfigMap
      metadata: { name: pc-deploy-state, namespace: "{{ k3s_namespace }}" }
      data:
        COMMON_ESCROW_INSTANCE_ID: "{{ (escrow_instance_id | default('', true) or escrow_instance_id_pda | default('')) | trim }}"
        IMAGE_TAG: "{{ image_tag | string }}"
        DEPLOYED_AT: "{{ ansible_date_time.iso8601 }}"

- name: Record when the rollout ended (sanity check 5 window)
  ansible.builtin.set_fact:
    _k3s_rollout_end: "{{ lookup('pipe', 'date +%s') }}"
