[package]
name = "private-channel-escrow-program-client"
version = "0.0.1"
edition = "2021"
description = "Rust client for the PrivateChannel Escrow Program"
license = "MIT"
repository = "https://github.com/solana-foundation/solana-private-channels"

[dependencies]
borsh = { workspace = true }
solana-account-info = "3"
# `borsh` provides the Borsh impls the generated account/instruction structs
# derive against. Host-only client crate, so it never reaches the program build.
solana-pubkey = { version = "4", features = ["borsh"] }
solana-instruction = "3"
solana-cpi = "3"
num-derive = { workspace = true }
num-traits = { workspace = true }

solana-client = { version = "4.2", optional = true }
solana-account = { version = "4", optional = true }
solana-program-error = "3"
thiserror = { workspace = true }

[features]
default = []
fetch = ["solana-client", "solana-account"]

[package.metadata.cargo-machete]
ignored = ["num-traits"]
