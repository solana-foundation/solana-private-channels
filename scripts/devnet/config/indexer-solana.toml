# Devnet configuration for Solana indexer (Yellowstone)

[common]
program_type = "escrow"
# TODO: Add devnet solana rpc url
rpc_url = "your_devnet_solana_rpc_url"
# Optional archival fallback for rpc_url. Re-checks a Dead finality verdict (operator)
# and backs the poller's missing-block failover. Empty = unset. Env: COMMON_FALLBACK_RPC_URL
# fallback_rpc_url = "https://your-archival-endpoint"
# Channel (gateway) RPC. Required for escrow: the startup supply invariant reads from it.
# TODO: Add devnet gateway read url
source_rpc_url = "your_devnet_gateway_url"
# TODO: Add escrow instance id
escrow_instance_id = "your_escrow_instance_id"

[storage]
type = "postgres"
max_connections = 10

[indexer]
datasource_type = "yellowstone"

[indexer.yellowstone]
# TODO: Add devnet solana yellowstone endpoint
endpoint = "your_devnet_solana_yellowstone_endpoint"

[indexer.rpc_polling]
poll_interval_ms = 1000
error_retry_interval_ms = 5000
batch_size = 50
# The polling loop's missing-metadata failover reads common.fallback_rpc_url.

[indexer.backfill]
enabled = false
backfill_only = false
# TODO: Add devnet solana rpc url
rpc_url = "your_devnet_solana_rpc_url"
batch_size = 100
max_gap_slots = 10000000
start_slot = 0
