---
# Secrets: one pc-<service> Secret per workload from secret_files, exact set (an empty
# value means no key; a key that left the set is removed). Values never reach values,
# ConfigMaps, Helm history, events or argv: Helm gets only the key names and hashes.
- name: Read the secrets-rev salt
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s_info:
    kubeconfig: "{{ pc_kubeconfig }}"
    kind: Secret
    namespace: "{{ k3s_namespace }}"
    name: pc-deploy-salt
  register: _k3s_salt_obj
  no_log: true

# Created once and kept: a salt regenerated per run would roll every pod on every deploy.
- name: Create the secrets-rev salt once
  when: not _k3s_salt_obj.resources
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    kubeconfig: "{{ pc_kubeconfig }}"
    state: present
    definition:
      apiVersion: v1
      kind: Secret
      metadata: { name: pc-deploy-salt, namespace: "{{ k3s_namespace }}" }
      type: Opaque
      data: { salt: "{{ lookup('community.general.random_string', length=64, special=false) | b64encode }}" }
  register: _k3s_salt_new
  no_log: true

- name: Keep the salt in memory only
  ansible.builtin.set_fact:
    _k3s_salt: "{{ ((_k3s_salt_new.result.data.salt) if _k3s_salt_new is not skipped else (_k3s_salt_obj.resources | first).data.salt) | b64decode }}"
  no_log: true

- name: Build the secret sets, key names and secrets-rev hashes
  ansible.builtin.import_tasks: secret_sets.yml

- name: Apply each service Secret (exact set)
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    kubeconfig: "{{ pc_kubeconfig }}"
    state: present
    # Replace, not merge, so a key that left the set disappears.
    force: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata:
        name: "pc-{{ item.key }}"
        namespace: "{{ k3s_namespace }}"
        labels: { private-channel.io/secret-set: app }
      type: Opaque
      data: "{{ dict(item.value | map(attribute='key') | zip(item.value | map(attribute='value') | map('string') | map('b64encode'))) }}"
  loop: "{{ _k3s_sets | dict2items }}"
  loop_control:
    label: "pc-{{ item.key }}"
  no_log: true

- name: List the app Secrets in the cluster
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s_info:
    kubeconfig: "{{ pc_kubeconfig }}"
    kind: Secret
    namespace: "{{ k3s_namespace }}"
    label_selectors: [ private-channel.io/secret-set=app ]
  register: _k3s_app_secrets
  no_log: true

- name: Delete app Secrets for services no longer deployed
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    kubeconfig: "{{ pc_kubeconfig }}"
    state: absent
    kind: Secret
    namespace: "{{ k3s_namespace }}"
    name: "{{ item }}"
  loop: "{{ _k3s_app_secrets.resources | map(attribute='metadata.name') | reject('in', _k3s_sets.keys() | map('regex_replace', '^', 'pc-') | list) | list }}"

# Only our GHCR images reference it; Docker Hub images pull without it.
- name: Apply the GHCR pull secret
  when: _registry_host == 'ghcr.io'
  delegate_to: localhost
  run_once: true
  kubernetes.core.k8s:
    kubeconfig: "{{ pc_kubeconfig }}"
    state: present
    force: true
    definition:
      apiVersion: v1
      kind: Secret
      metadata: { name: pc-ghcr, namespace: "{{ k3s_namespace }}" }
      type: kubernetes.io/dockerconfigjson
      data:
        .dockerconfigjson: "{{ {'auths': {'ghcr.io': {'auth': (ghcr_user ~ ':' ~ ghcr_token) | b64encode}}} | to_json | b64encode }}"
  no_log: true

- name: Write values.generated.yaml (no secret values)
  delegate_to: localhost
  run_once: true
  ansible.builtin.template:
    src: templates/k3s/values.generated.yaml.j2
    dest: "{{ pc_tmp }}/values.generated.yaml"
    mode: "0600"
