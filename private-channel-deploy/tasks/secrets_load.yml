---
# Secrets backend selection and loading; imported by deploy.yml and k3s.yml.

# Secrets backend: 'file' (default) loads the gitignored secrets.yml; 'doppler'
# pulls the same keys from Doppler at deploy time. Opt-in and per-operator: it
# auto-selects 'doppler' only when DOPPLER_TOKEN is set in your environment, so
# every other user's plain-file flow is unchanged. Force either way with
# `-e secrets_backend=file` or `-e secrets_backend=doppler`.
- name: Resolve secrets backend
  ansible.builtin.set_fact:
    secrets_backend: >-
      {{ secrets_backend | default('doppler' if (lookup('env', 'DOPPLER_TOKEN') | length > 0) else 'file', true) }}
  tags: [ always ]
  run_once: true
  delegate_to: localhost

- name: Report secrets backend
  ansible.builtin.debug:
    msg: "Secrets backend: {{ secrets_backend }}"
  tags: [ always ]
  run_once: true
  delegate_to: localhost

# File backend: gitignored plain-text secrets.yml (see .gitignore).
- name: Load plain-text secrets (file backend)
  ansible.builtin.include_vars:
    file: "{{ playbook_dir }}/secrets.yml"
  when: secrets_backend == 'file'
  tags: [ always ]
  run_once: true
  delegate_to: localhost
  # With -v the result lists every loaded value.
  no_log: true

# Doppler backend: fetch the config's secrets at deploy time and map them onto
# the same var names the file backend provides, so everything downstream is
# unchanged. The service token (DOPPLER_TOKEN) pins the project + config, so no
# project/config flags are needed. Doppler keys are the UPPERCASE of these names
# (e.g. rpc_url -> RPC_URL). Requires the Doppler CLI on the control node.
- name: Load secrets from Doppler (doppler backend)
  when: secrets_backend == 'doppler'
  tags: [ always ]
  run_once: true
  delegate_to: localhost
  block:
  - name: Assert Doppler CLI is available
    ansible.builtin.command: doppler --version
    register: doppler_cli
    changed_when: false

  - name: Fetch secrets from Doppler
    # The CLI reads DOPPLER_TOKEN from the inherited env; an environment: block
    # would print the token at -vvv.
    ansible.builtin.command: doppler secrets download --no-file --format json
    register: doppler_download
    changed_when: false
    no_log: true

  - name: Map Doppler secrets onto deploy vars
    ansible.builtin.set_fact:
      postgres_password: "{{ _d.POSTGRES_PASSWORD | default('') }}"
      postgres_replication_password: "{{ _d.POSTGRES_REPLICATION_PASSWORD | default('') }}"
      postgres_runtime_password: "{{ _d.POSTGRES_RUNTIME_PASSWORD | default('') }}"
      postgres_auth_runtime_password: "{{ _d.POSTGRES_AUTH_RUNTIME_PASSWORD | default('') }}"
      postgres_auth_owner_password: "{{ _d.POSTGRES_AUTH_OWNER_PASSWORD | default('') }}"
      postgres_gateway_password: "{{ _d.POSTGRES_GATEWAY_PASSWORD | default('') }}"
      postgres_monitoring_password: "{{ _d.POSTGRES_MONITORING_PASSWORD | default('') }}"
      postgres_grafana_password: "{{ _d.POSTGRES_GRAFANA_PASSWORD | default('') }}"
      postgres_indexer_password: "{{ _d.POSTGRES_INDEXER_PASSWORD | default('') }}"
      jwt_secret: "{{ _d.JWT_SECRET | default('') }}"
      jwt_secret_previous: "{{ _d.JWT_SECRET_PREVIOUS | default('') }}"
      grafana_admin_password: "{{ _d.GRAFANA_ADMIN_PASSWORD | default('') }}"
      ghcr_user: "{{ _d.GHCR_USER | default('') }}"
      ghcr_token: "{{ _d.GHCR_TOKEN | default('') }}"
      yellowstone_token: "{{ _d.YELLOWSTONE_TOKEN | default('') }}"
      escrow_confidential_keys: "{{ _d.ESCROW_CONFIDENTIAL_KEYS | default('') }}"
      escrow_confidential_pubkey: "{{ _d.ESCROW_CONFIDENTIAL_PUBKEY | default('') }}"
      # yellowstone_endpoint normally comes from vars/<env>.yml; only override it
      # when the Doppler config carries DEVNET_YELLOWSTONE_ENDPOINT (its .env name).
      # These use the boolean form of default() so a key that exists in Doppler
      # with an empty value falls through to the vars file instead of clobbering it.
      yellowstone_endpoint: "{{ _d.DEVNET_YELLOWSTONE_ENDPOINT | default(yellowstone_endpoint | default(''), true) }}"
      rpc_url: "{{ _d.RPC_URL | default(rpc_url | default(''), true) }}"
      fallback_rpc_url: "{{ _d.FALLBACK_RPC_URL | default(fallback_rpc_url | default(''), true) }}"
      gateway_whitelist_rpc_url: "{{ _d.GATEWAY_WHITELIST_RPC_URL | default(gateway_whitelist_rpc_url | default(''), true) }}"
      # Remote signer secrets, under their container env names.
      admin_vault_token: "{{ _d.ADMIN_VAULT_TOKEN | default(admin_vault_token | default(''), true) }}"
      operator_vault_token: "{{ _d.OPERATOR_VAULT_TOKEN | default(operator_vault_token | default(''), true) }}"
      admin_turnkey_api_private_key: "{{ _d.ADMIN_TURNKEY_API_PRIVATE_KEY | default(admin_turnkey_api_private_key | default(''), true) }}"
      operator_turnkey_api_private_key: "{{ _d.OPERATOR_TURNKEY_API_PRIVATE_KEY | default(operator_turnkey_api_private_key | default(''), true) }}"
      admin_privy_app_secret: "{{ _d.ADMIN_PRIVY_APP_SECRET | default(admin_privy_app_secret | default(''), true) }}"
      operator_privy_app_secret: "{{ _d.OPERATOR_PRIVY_APP_SECRET | default(operator_privy_app_secret | default(''), true) }}"
      # Memory signer keypairs (JSON byte arrays); refused on mainnet.
      _doppler_keypairs:
        admin: "{{ _d.ADMIN_KEYPAIR | default('') }}"
        operator: "{{ _d.OPERATOR_KEYPAIR | default('') }}"
      # The runtime webhook secret file is ALERT_WEBHOOK_URL; accept either name.
      notify_webhook: "{{ _d.ALERT_WEBHOOK_URL | default(_d.NOTIFY_WEBHOOK | default(''), true) }}"
      # Grafana's contact point; an empty or absent key keeps the no-op default.
      alert_webhook_url: "{{ _d.GRAFANA_ALERT_WEBHOOK_URL | default(alert_webhook_url | default(''), true) }}"
      # k3s only: the backup bucket keys for the CNPG Barman plugin.
    vars:
      _d: "{{ doppler_download.stdout | from_json }}"
    no_log: true
