# Example inventory with one group per network. Copy to inventory.ini and keep the
# groups you deploy. The group name selects vars/<group>.yml:
#   [dev]     -> vars/dev.yml      (localnet, the bundled validator; shipped)
#   [devnet]  -> vars/devnet.yml   (copy from vars/devnet.example.yml)
#   [mainnet] -> vars/mainnet.yml  (copy from vars/mainnet.example.yml)
# Deploy one group at a time: ansible-playbook deploy.yml -l devnet
#
# Only [dev] turns host key checking off. Pre-trust the others first:
#   ssh-keyscan -H <host> >> ~/.ssh/known_hosts
# The SSH user needs passwordless sudo on the target.

[dev]
private-channel ansible_host=<DEV_IP_ADDRESS> ansible_user=<USER> ansible_ssh_private_key_file=~/.ssh/id_ed25519 ansible_host_key_checking=False

[devnet]
private-channel-devnet ansible_host=<DEVNET_IP_ADDRESS> ansible_user=<USER> ansible_ssh_private_key_file=~/.ssh/id_ed25519

[mainnet]
private-channel-mainnet ansible_host=<MAINNET_IP_ADDRESS> ansible_user=<USER> ansible_ssh_private_key_file=~/.ssh/id_ed25519
