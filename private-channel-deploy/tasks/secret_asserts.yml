---
# Required-secret asserts; imported by deploy.yml and k3s.yml.

# ---- Required secrets (one assert per key) ----
- name: Assert postgres_password is set
  ansible.builtin.assert:
    that: postgres_password | default('') | length > 0
    fail_msg: |
      `postgres_password` empty in secrets.yml. Sets the private_channel DB password on postgres-primary.
      Fix: edit private-channel-deploy/secrets.yml and add `postgres_password: <strong-password>`.

# pc_require_replication_password=false (no replica) skips this and the compare below.
- name: Assert postgres_replication_password is set
  when: pc_require_replication_password | default(true) | bool
  ansible.builtin.assert:
    that: postgres_replication_password | default('') | length > 0
    fail_msg: |
      `postgres_replication_password` empty in secrets.yml. postgres-replica uses it for streaming replication.
      Fix: edit secrets.yml and add `postgres_replication_password: repl_password` (literal, until init-primary.sql is parameterised).

- name: Assert the per-service postgres passwords are set
  ansible.builtin.assert:
    that:
      - postgres_runtime_password | default('') | length > 0
      - postgres_auth_runtime_password | default('') | length > 0
      - postgres_auth_owner_password | default('') | length > 0
      - postgres_gateway_password | default('') | length > 0
      - postgres_monitoring_password | default('') | length > 0
      - postgres_grafana_password | default('') | length > 0
      - postgres_indexer_password | default('') | length > 0
    fail_msg: |
      One of `postgres_runtime_password`, `postgres_auth_runtime_password`, `postgres_auth_owner_password`,
      `postgres_gateway_password`, `postgres_monitoring_password`, `postgres_grafana_password`,
      `postgres_indexer_password` is empty in secrets.yml. init-auth-roles.sql sets one per service
      login on postgres-primary, init-indexer-roles.sql sets Grafana's on postgres-indexer, and
      postgres_indexer_password is that cluster's own superuser. Fix: edit secrets.yml and add all
      seven. Generate each fresh: openssl rand -hex 16.

# Sharing one value would give a compromised service every other login's
# rights, which is exactly what separating them is for.
# Also tagged config_asserts: it probes no host, so the preflight test runs it.
- name: Assert the postgres logins do not share a password
  tags: [ config_asserts ]
  vars:
    candidates:
      - "{{ postgres_password }}"
      # Carries REPLICATION, so it can pg_basebackup the whole cluster,
      # auth schema included, whatever the grants say.
      - "{{ postgres_replication_password if pc_require_replication_password | default(true) | bool else postgres_replication_password | default('') }}"
      - "{{ postgres_runtime_password }}"
      - "{{ postgres_auth_runtime_password }}"
      - "{{ postgres_auth_owner_password }}"
      - "{{ postgres_gateway_password }}"
      - "{{ postgres_monitoring_password }}"
      - "{{ postgres_grafana_password }}"
      - "{{ postgres_indexer_password }}"
    # An empty replication password is only allowed when it is not required; it then joins no compare.
    _compared: >-
      {{ candidates if pc_require_replication_password | default(true) | bool or candidates[1] | string | length > 0
         else [candidates[0]] + candidates[2:] }}
  ansible.builtin.assert:
    that: (_compared | unique | length) == (_compared | length)
    fail_msg: |
      Two postgres logins share a password. Each needs its own, or a compromised service
      holds the others' rights. Fix: edit secrets.yml and give each one a distinct value.

# Grafana's datasource reads the indexer database, so this login guards
# participant state. The rejected values were once shipped in tracked presets.
- name: Assert grafana_admin_password is set and not a shipped default
  ansible.builtin.assert:
    that:
      - grafana_admin_password | default('') | length > 0
      - grafana_admin_password not in ['admin', 'admin123']
    fail_msg: |
      `grafana_admin_password` is empty or a value once shipped in the repository. It is Grafana's
      admin login, whose datasource queries the indexer database.
      Fix: edit secrets.yml and set `grafana_admin_password` to a fresh value: openssl rand -hex 16.

# Only required when enforcement is on: env.j2 blanks JWT_SECRET when
# gateway_enforce_jwt is false, so the secret's value is unused there.
# Mirror the template's `default(true)` so an unset flag still requires it.
- name: Assert jwt_secret is set
  ansible.builtin.assert:
    # Auth and the gateway refuse a secret under 32 bytes after trimming, so fail here first.
    that: jwt_secret | default('') | trim | length >= 32
    fail_msg: |
      `jwt_secret` missing, whitespace-only or under 32 bytes in secrets.yml. Used by gateway to sign auth tokens.
      Fix: edit secrets.yml and add `jwt_secret: <random-32+-byte-string>`  (e.g. `openssl rand -hex 32`).
  when: gateway_enforce_jwt | default(true) | bool

- name: Assert GHCR creds present
  when: _registry_host == 'ghcr.io'
  ansible.builtin.assert:
    that:
    - ghcr_user | default('') | length > 0
    - ghcr_token | default('') | length > 0
    fail_msg: |
      `ghcr_user`/`ghcr_token` empty in secrets.yml. Deploy needs them to docker-login to GHCR before pulling images.
      Fix: edit secrets.yml — `ghcr_user: <github-username>`, `ghcr_token: <PAT with read:packages>`.

# The PAT sits on the target during the pull, so it must be unable to push.
# PC_TEST_GITHUB_API is a test hook read from the environment, never a var, so
# a typo in vars cannot send the PAT anywhere else.
- name: Check the GHCR token scopes
  when: _registry_host == 'ghcr.io'
  tags: [ preflight, remote_checks ]
  delegate_to: localhost
  run_once: true
  block:
  - name: Refuse a fine-grained GHCR token
    ansible.builtin.assert:
      that: not (ghcr_token | default('')).startswith('github_pat_')
      fail_msg: |
        ghcr_token is a fine-grained PAT (github_pat_ prefix). GHCR only accepts a
        classic PAT. Fix: create a classic PAT with only the read:packages scope.

  - name: Ask GitHub for the GHCR token scopes
    ansible.builtin.uri:
      url: "{{ lookup('env', 'PC_TEST_GITHUB_API') | default('https://api.github.com', true) }}/user"
      headers:
        Authorization: "token {{ ghcr_token }}"
        Accept: application/vnd.github+json
      status_code: [ 200, 401 ]
      timeout: 10
    register: _gh_user
    failed_when: false
    no_log: true

  - name: Warn when the GHCR token scopes cannot be checked
    when: _gh_user.status | default(-1) | int not in [200, 401]
    ansible.builtin.debug:
      msg: >-
        WARNING: could not verify the GHCR token scopes (GitHub API status
        {{ _gh_user.status | default(-1) }}). Continuing; the PAT must be read:packages only.

  - name: Refuse a GHCR token that is not provably read:packages only
    when: _gh_user.status | default(-1) | int in [200, 401]
    vars:
      _scopes: "{{ _gh_user.x_oauth_scopes | default(none) }}"
    ansible.builtin.assert:
      that:
      - _gh_user.status | int == 200
      - _scopes is not none
      - (_scopes | string).split(',') | map('trim') | reject('equalto', '') | list == ['read:packages']
      fail_msg: >-
        {% if _gh_user.status | int == 401 %}ghcr_token was rejected by GitHub (401): the token is invalid or expired.
        {% elif _scopes is none %}GitHub returned no X-OAuth-Scopes header, so read-only cannot be proven.
        {% else %}ghcr_token has scopes: {{ _scopes }}. A deploy token must have exactly read:packages.
        {% endif %}Fix: use a classic PAT with only read:packages, ideally on an org-scoped bot account.

# Yellowstone gRPC required for indexer-solana on public clusters
# (localnet uses the bundled validator's Yellowstone, no external endpoint).
- name: Assert yellowstone_endpoint set when network is not localnet
  ansible.builtin.assert:
    that: yellowstone_endpoint | default('') | length > 0
    fail_msg: |
      `yellowstone_endpoint` empty but network={{ network }}. indexer-solana streams events via Yellowstone gRPC; public Solana RPC doesn't include it.
      Fix: set `yellowstone_endpoint: <provider-url>` in vars/dev.yml. Providers: Helius (helius.dev), Triton (triton.one), QuickNode. No officially-free option for devnet/mainnet today.
  when: network != 'localnet'

- name: Assert yellowstone_token set when network is not localnet
  ansible.builtin.assert:
    that: yellowstone_token | default('') | length > 0
    fail_msg: |
      `yellowstone_token` empty but network={{ network }}. All paid Yellowstone providers gate gRPC behind an auth token.
      Fix: edit secrets.yml and add `yellowstone_token: <provider-token>` (e.g. Helius `x-token`).
  when: network != 'localnet'
