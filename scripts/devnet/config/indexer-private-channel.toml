# Devnet configuration for Solana Private Channels indexer (RPC Polling)
# Monitors Solana Private Channels for withdrawals via gateway

[common]
program_type = "withdraw"
# Solana Private Channels gateway based on docker compose, on its internal
# listener: no JWT is carried and getBlock is operator-only on the public one.
# Compose overrides this with the read-node, which serves the same reads.
rpc_url = "http://gateway:8904"
# Optional archival fallback for rpc_url. Re-checks a Dead finality verdict (operator)
# and backs the poller's missing-block failover. Empty = unset. Env: COMMON_FALLBACK_RPC_URL
# fallback_rpc_url = "https://your-archival-endpoint"

[storage]
type = "postgres"
max_connections = 10

[indexer]
datasource_type = "rpc_polling"

[indexer.rpc_polling]
start_slot = 0
poll_interval_ms = 1000
error_retry_interval_ms = 5000
batch_size = 50
# The polling loop's missing-metadata failover reads common.fallback_rpc_url.

[indexer.backfill]
enabled = false
backfill_only = false
batch_size = 100
max_gap_slots = 10000000
