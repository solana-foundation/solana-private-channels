# Devnet configuration for Solana Private Channels Operator (withdraw program)
# Processes withdrawals FROM Solana Private Channels → Releases funds TO Solana

[common]
program_type = "withdraw"
# TODO: Add solana devnet rpc url
rpc_url = "your_solana_devnet_rpc_url"
# Optional archival Solana fallback for rpc_url. Re-checks a Dead finality verdict
# before a remint/re-release. Empty = unset. Env: COMMON_FALLBACK_RPC_URL
# fallback_rpc_url = "https://your-archival-endpoint"
# Solana Private Channels gateway URL — operator-private-channel reads withdrawal events from the Solana Private Channels write-node
# TODO: Add devnet private-channel gateway url
source_rpc_url = "your_devnet_gateway_url"
# TODO: Add escrow instance id
escrow_instance_id = "your_escrow_instance_id"

[storage]
type = "postgres"
max_connections = 10

[operator]
poll_interval_secs = 1
batch_size = 10
retry_max_attempts = 3
retry_base_delay_secs = 1
channel_buffer_size = 100
# Solana devnet block time is ~400 ms
confirmation_poll_interval_ms = 400
