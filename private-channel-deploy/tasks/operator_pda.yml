---
# Operator PDA check; imported by deploy.yml and k3s.yml.

- name: Probe the solana CLI
  ansible.builtin.command: solana --version
  register: _solana_cli
  changed_when: false
  failed_when: false

- name: Assert the solana CLI is present
  ansible.builtin.assert:
    that: _solana_cli.rc == 0
    fail_msg: "The solana CLI is needed on the control node to derive the Operator PDA. Install it (make install-toolchain)."

- name: Derive the Operator PDA
  ansible.builtin.command:
    argv: [ solana, find-program-derived-address, "{{ compiled_escrow_program_id }}", "string:operator",
            "pubkey:{{ _escrow_instance }}", "pubkey:{{ pc_operator_pubkey }}" ]
  register: _operator_pda
  changed_when: false

# rpc_url carries the provider API key. A localnet rpc_url points at the target's validator.
# pc_pda_rpc_url and pc_pda_rpc_delegate override the URL and the host that reads it.
- name: Read the Operator PDA
  delegate_to: "{{ pc_pda_rpc_delegate | default(inventory_hostname if network == 'localnet' else 'localhost') }}"
  ansible.builtin.uri:
    url: "{{ pc_pda_rpc_url | default(rpc_url) }}"
    method: POST
    body_format: json
    body:
      jsonrpc: "2.0"
      id: 1
      method: getAccountInfo
      params: [ "{{ _operator_pda.stdout | trim }}", { encoding: base64 } ]
    timeout: 15
  register: _pda_info
  failed_when: false
  no_log: true

- name: Warn when the Operator PDA cannot be read
  when: _pda_info.status | default(-1) | int != 200 or _pda_info.json.result is not defined
  ansible.builtin.debug:
    msg: >-
      WARNING: could not check the Operator PDA for operator {{ pc_operator_pubkey }}
      (RPC status {{ _pda_info.status | default(-1) }}). Continuing.

- name: Refuse an operator that was never added
  when: _pda_info.status | default(-1) | int == 200 and _pda_info.json.result is defined
  ansible.builtin.assert:
    that:
    - _pda_info.json.result.value is not none
    - _pda_info.json.result.value.owner == compiled_escrow_program_id
    fail_msg: >-
      {% if _pda_info.json.result.value is none %}No Operator PDA for operator {{ pc_operator_pubkey }} on instance {{ _escrow_instance }}:
      every ReleaseFunds would fail.
      {% else %}The Operator PDA for {{ pc_operator_pubkey }} is owned by {{ _pda_info.json.result.value.owner }}, not the escrow program.
      {% endif %}Fix: run add_operator for {{ pc_operator_pubkey }} with the Instance.admin key, then redeploy.

# ReleaseFunds accepts any wallet with an Operator PDA. A 0.1.0 stack registered the channel
# admin, and nothing removes that, so a leaked admin key could release escrow with no burn.
# Localnet may share one key for both roles, so the check runs off localnet only.
- name: Check that no admin key holds an Operator PDA
  when: network != 'localnet'
  vars:
    _admin_keys: >-
      {{ ([pc_admin_pubkey | default('')] + (extra_admin_keys | default([])))
         | map('string') | map('trim') | select | unique | reject('equalto', pc_operator_pubkey) | list }}
  block:
  - name: Warn while the admin Operator PDA override is on
    when: pc_allow_admin_operator_pda | default(false) | bool
    ansible.builtin.debug:
      msg: >-
        WARNING: pc_allow_admin_operator_pda is true, so an admin key with an Operator PDA is
        accepted. Run remove_operator for it (UPGRADING.md, "Retire the admin's Operator PDA")
        and drop the override.

  - name: Derive the admin Operator PDAs
    ansible.builtin.command:
      argv: [ solana, find-program-derived-address, "{{ compiled_escrow_program_id }}", "string:operator",
              "pubkey:{{ _escrow_instance }}", "pubkey:{{ item }}" ]
    loop: "{{ _admin_keys }}"
    register: _admin_pdas
    changed_when: false

  - name: Read the admin Operator PDAs
    delegate_to: "{{ pc_pda_rpc_delegate | default('localhost') }}"
    ansible.builtin.uri:
      url: "{{ pc_pda_rpc_url | default(rpc_url) }}"
      method: POST
      body_format: json
      body:
        jsonrpc: "2.0"
        id: 1
        method: getAccountInfo
        params: [ "{{ item.stdout | trim }}", { encoding: base64 } ]
      timeout: 15
    loop: "{{ _admin_pdas.results }}"
    register: _admin_pda_info
    failed_when: false
    no_log: true

  # Reduced to key, status and owner, so no later task can print the RPC URL.
  - name: Reset the admin Operator PDA summary
    ansible.builtin.set_fact:
      _admin_pda_seen: []

  - name: Summarise the admin Operator PDA reads
    ansible.builtin.set_fact:
      _admin_pda_seen: >-
        {{ _admin_pda_seen + [{
             'key': item.item.item,
             'read': (item.status | default(-1) | int == 200 and item.json.result is defined),
             'status': item.status | default(-1),
             'owner': ((item.json.result.value.owner | default('')) if (item.json.result.value | default(none)) is not none else '')
               if (item.status | default(-1) | int == 200 and item.json.result is defined) else ''
           }] }}
    loop: "{{ _admin_pda_info.results }}"
    no_log: true

  - name: Warn when an admin Operator PDA cannot be read
    when: not item.read
    ansible.builtin.debug:
      msg: >-
        WARNING: could not check the admin Operator PDA for {{ item.key }}
        (RPC status {{ item.status }}). Continuing.
    loop: "{{ _admin_pda_seen }}"
    loop_control:
      label: "{{ item.key }}"

  # Fires only on proof: the PDA exists and the escrow program owns it.
  - name: Refuse an admin key that holds an Operator PDA
    when:
    - not (pc_allow_admin_operator_pda | default(false) | bool)
    - item.read
    ansible.builtin.assert:
      that: item.owner != compiled_escrow_program_id
      fail_msg: >-
        Admin key {{ item.key }} holds an Operator PDA on instance {{ _escrow_instance }}, so it can sign
        ReleaseFunds. Fix: run remove_operator for {{ item.key }} with the Instance.admin key
        (UPGRADING.md, "Retire the admin's Operator PDA"), then redeploy. For one transition run,
        -e pc_allow_admin_operator_pda=true accepts it with a warning.
      quiet: true
    loop: "{{ _admin_pda_seen }}"
    loop_control:
      label: "{{ item.key }}"
