[package]
name = "tests-private-channel-escrow-program"
version = { workspace = true }
edition = { workspace = true }

[dependencies]
const-crypto = { workspace = true }
litesvm = "0.16"
private-channel-escrow-program-client = { workspace = true, features = ["fetch"] }
# These follow the generated client, which core also links, so the address type
# is the same one everywhere. LiteSVM 0.16 targets the same runtime release.
solana-sdk = { workspace = true }
solana-program = { workspace = true }
spl-token = { workspace = true }
spl-token-2022 = { workspace = true }
# Token 2022 extension fields hold their optional keys as MaybeNull now.
solana-nullable = "1.3"
spl-associated-token-account = { workspace = true }
solana-program-pack = { workspace = true }
solana-compute-budget-interface = { workspace = true }
solana-sdk-ids = { workspace = true }
solana-system-interface = { workspace = true }
