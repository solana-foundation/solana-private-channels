apiVersion: 1
# Grafana file provisioning never removes a rule that vanishes from this file,
# so retired uids must be deleted explicitly or boxes provisioned from an
# older commit keep firing the stale rule alongside the current ones.
deleteRules:
  - orgId: 1
    uid: service-down-probe-indexer
groups:
  - orgId: 1
    name: indexer-lag-alerts
    folder: Solana Private Channels Alerts
    interval: 10s
    rules:
      - uid: indexer-lag-10s
        title: "Indexer lag exceeds 10 seconds"
        condition: C
        for: 30s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Indexer {{ $labels.program_type }} is {{ $values.A }} seconds behind chain tip"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: (private_channel_indexer_chain_tip_slot - private_channel_indexer_current_slot) * 0.4
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [10]
              refId: C

  - orgId: 1
    name: service-down-alerts
    folder: Solana Private Channels Alerts
    interval: 10s
    rules:
      # Hard-down tier: the metrics port is unreachable (crash, OOM, restart-loop).
      # This never flaps on a routine stream reconnect, so keep it fast (30s) — it
      # is the immediate page when the process is actually gone.
      - uid: service-down-scrape
        title: "Solana Private Channels service down (scrape target unreachable)"
        condition: C
        for: 30s
        # Same policy as the probe rule below: no series means this stack has
        # none of these scrape jobs configured, not an outage. A configured
        # target that goes down still emits up=0 and fires. Silent loss of the
        # series themselves is caught by monitored-series-vanished below.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Service {{ $labels.job }} is down (Prometheus scrape failed)"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              # Prod (Ansible) job names plus the dev/devnet compose job names.
              # Keep in sync with monitored-series-vanished below.
              expr: up{job=~"private-channel-(indexer|operator)-.*|gateway|(indexer|operator)-(solana|private-channel)"}
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C

      # A failing /health probe means a real outage: page fast (30s), all services.
      - uid: service-down-probe
        title: "Solana Private Channels service down (health probe failed)"
        condition: C
        for: 30s
        # No series means this stack probes none of these targets (e.g. a dev
        # monitoring stack), not an outage. A real down still emits
        # probe_success=0 and fires. Avoids a permanent alert on empty results.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Service {{ $labels.instance }} is down (health check failed)"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              # The `or up` arm keeps each firing instance alive if the blackbox
              # exporter itself dies mid-outage: probe_success goes stale (which
              # would resolve the alert and send a false all-clear), but the
              # per-target up series keep reporting 0 with the same instance
              # label, so the incident stays firing under the same title while
              # blackbox-probe-pipeline-down names the cause. On a stack with no
              # blackbox job both arms are empty and noDataState: OK applies.
              expr: min by (instance) (probe_success{job="blackbox-http"}) or min by (instance) (up{job="blackbox-http"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C

      # Probe-pipeline health. The probe rule above uses noDataState OK so
      # a stack that doesn't probe a given target set can't false-alert. The flip
      # side: a dead blackbox exporter (all probe_success series vanish) would then
      # look healthy. Watch the pipeline itself — up == 0 on the blackbox job means
      # Prometheus can't reach the exporter, so no /health probing is happening.
      - uid: blackbox-probe-pipeline-down
        title: "Health-probe pipeline down (blackbox exporter unreachable)"
        condition: C
        for: 1m
        # noData means the blackbox job isn't configured here (a stack not running
        # probes), not a failure. A reachable-but-down exporter emits up=0 and fires.
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Blackbox exporter unreachable; no /health probing is happening and every service-down (health probe failed) alert is unreliable until this resolves. Check the blackbox-exporter container (docker compose ps blackbox-exporter, then its logs) and the blackbox-http job in the prometheus scrape config."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              # max() over the per-target up series: one alert instance for the
              # exporter instead of one per probed URL (relabeling sets instance
              # to the probed service URL, so without the aggregation a dead
              # exporter paged as if every service URL were "the unreachable
              # exporter"). Aggregation over no series is still no data, so
              # noDataState: OK is preserved.
              expr: max(up{job="blackbox-http"})
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
              refId: C

      # Loss-of-coverage guard for the noDataState: OK rules above. Those stay
      # quiet when series never existed (a stack that doesn't run these jobs),
      # which also means they stay quiet if the series silently vanish: a probe
      # target dropped from the blackbox job, a renamed or deleted scrape job,
      # prometheus.yml render drift, or Grafana pointed at the wrong Prometheus.
      # This pages when a health-probe or scrape-target series that existed in
      # the last 24h is gone now. Self-limiting by design: an intentional
      # removal pages until the old series ages out of the 24h window, then
      # goes quiet on its own.
      - uid: monitored-series-vanished
        title: "Monitoring coverage lost (previously monitored series vanished)"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "{{ $values.A }} health-probe or scrape-target series present in the last 24h are gone. A down service would page; a missing series is silent — check the prometheus scrape config (blackbox-http targets and the service jobs) and PROMETHEUS_URL before trusting the quiet."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              # Series seen in the last 24h minus series present now, for the
              # blackbox probes and the service scrape jobs (job regex kept in
              # sync with service-down-scrape). The `or vector(0)` on every
              # operand keeps the expression defined, so this rule itself can
              # never sit in NoData while Prometheus is reachable.
              expr: ((count(last_over_time(probe_success{job="blackbox-http"}[24h])) or vector(0)) - (count(probe_success{job="blackbox-http"}) or vector(0))) + ((count(last_over_time(up{job=~"private-channel-(indexer|operator)-.*|gateway|(indexer|operator)-(solana|private-channel)"}[24h])) or vector(0)) - (count(up{job=~"private-channel-(indexer|operator)-.*|gateway|(indexer|operator)-(solana|private-channel)"}) or vector(0)))
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C

  - orgId: 1
    name: feepayer-alerts
    folder: Solana Private Channels Alerts
    interval: 1m
    rules:
      - uid: feepayer-warn-balance
        title: "Feepayer SOL balance below 1.0 (warn)"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Feepayer {{ $labels.job }} ({{ $labels.program_type }}) balance is {{ $values.A }} SOL — schedule a top-up"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: private_channel_feepayer_balance_lamports{job="private-channel-operator-solana"} / 1e9
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [1.0]
              refId: C

      - uid: feepayer-low-balance
        title: "Feepayer SOL balance below 0.5"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Feepayer {{ $labels.job }} ({{ $labels.program_type }}) balance is {{ $values.A }} SOL — top up immediately"
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 60
              to: 0
            datasourceUid: prometheus
            model:
              expr: private_channel_feepayer_balance_lamports{job="private-channel-operator-solana"} / 1e9
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: lt
                    params: [0.5]
              refId: C

  - orgId: 1
    name: indexer-reconnect-alerts
    folder: Solana Private Channels Alerts
    interval: 1m
    rules:
      # Early smoke for a reconnect storm, before it becomes a sustained stall.
      # Baseline is near-zero reconnects/day; more than 5 in 15m means the
      # upstream stream is genuinely flapping (provider or network churn). The
      # threshold is 5.5 rather than 5 because increase() extrapolates to the
      # window boundaries: exactly 5 reconnects evaluates just above 5 and
      # would trip a gt-5 check one reconnect below the bar. Severity warning:
      # the default notification policy has a single receiver and no severity
      # matchers, so today this delivers exactly like a critical — the label
      # exists so a deployment can route warnings to a softer channel with a
      # severity matcher in notification-policies.yml.
      - uid: indexer-reconnect-storm
        title: "Indexer datasource reconnecting abnormally often"
        condition: C
        for: 1m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Indexer {{ $labels.program_type }} reconnected {{ printf \"%.0f\" $values.A.Value }} times in 15m (routine is near-zero); upstream stream is flapping"
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(private_channel_indexer_datasource_reconnects_total[15m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [5.5]
              refId: C

  - orgId: 1
    name: indexer-missing-meta-alerts
    folder: Solana Private Channels Alerts
    interval: 1m
    rules:
      - uid: indexer-missing-meta
        title: "Indexer slot stuck on missing transaction metadata"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Indexer {{ $labels.program_type }} is rejecting a slot whose transactions are missing metadata (meta: null); the checkpoint cannot advance past it. Repoint the datasource RPC (or configure an archival fallback_rpc_url) at a full-history endpoint. This catches the sustained live-polling wedge; a backfill or resync hitting missing metadata instead aborts loudly with a MissingMeta error in the logs rather than sustaining this metric."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(private_channel_indexer_rpc_errors_total{error_type="missing_meta"}[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C

  - orgId: 1
    name: indexer-block-unproven-alerts
    folder: Solana Private Channels Alerts
    interval: 1m
    rules:
      - uid: indexer-block-unproven
        title: "Indexer cannot prove a slot's contents and will not advance"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Indexer {{ $labels.program_type }} cannot determine what a slot contains, so it is refusing to checkpoint past it. Unlike block_unavailable this is not a positive proof that a block exists: the classifier could not obtain the witness it needs, most often a trailing run of non-producers whose first block past the batch the endpoint will not serve. The indexer retries forever and reports zero lag while wedged, so this keys off the error counter. Repoint the datasource at a full-history archival endpoint and restart. See docs/runbooks/indexer_block_unavailable.md."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(private_channel_indexer_rpc_errors_total{error_type="block_unproven"}[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C

  - orgId: 1
    name: indexer-block-unavailable-alerts
    folder: Solana Private Channels Alerts
    interval: 1m
    rules:
      - uid: indexer-block-unavailable
        title: "Indexer slot stuck on a block the RPC will not serve"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Indexer {{ $labels.program_type }} has proven that a block exists at a slot the datasource RPC will not serve, so the checkpoint cannot advance past it. This is a positive proof from a later block's parentSlot link, not a guess: the slot is not a skip. Repoint COMMON_RPC_URL (or COMMON_FALLBACK_RPC_URL) at a full-history archival endpoint and restart. This keys off the error counter rather than the checkpoint frontier-lag gauge, because an ungated RPC-polling indexer reports zero lag while wedged. See docs/runbooks/indexer_block_unavailable.md."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: rate(private_channel_indexer_rpc_errors_total{error_type="block_unavailable"}[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C

  - orgId: 1
    name: remint-claim-alerts
    folder: Solana Private Channels Alerts
    interval: 1m
    rules:
      - uid: remint-claim-lost
        title: "Remint pre-send claim lost (second sender detected)"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Operator {{ $labels.job }} ({{ $labels.program_type }}) lost a remint claim, which is only possible if a second sender is running against the same database. The loser refused to broadcast, so no double mint happened yet; stop the duplicate operator and re-check the sender advisory lock before the next pending remint matures. With the sender lock heartbeat enabled a second sender should be killed within about 7s, so this firing means the heartbeat is disabled or misconfigured, or the two senders are on different databases."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(private_channel_operator_remint_claim_lost_total[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C

      - uid: sender-lock-lost
        title: "Sender advisory lock ownership could not be proven"
        condition: C
        for: 0s
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Operator {{ $labels.job }} ({{ $labels.program_type }}) could not prove it still owns its sender advisory lock (reason {{ $labels.reason }}) and shut itself down. Runbook: docs/runbooks/sender_lock_lost_runbook.md. Confirm the operator restarted and that exactly one sender holds each role key; note that OPERATOR_TASK_EXIT will normally be labelled fetcher, not sender, on this shutdown."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(private_channel_operator_sender_lock_lost_total[5m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
              refId: C

  - orgId: 1
    name: tree-rotation-alerts
    folder: Solana Private Channels Alerts
    interval: 1m
    rules:
      - uid: rotation-not-landing
        title: "Tree rotation owed but not landing"
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Operator {{ $labels.job }} ({{ $labels.program_type }}) owes a tree rotation that keeps failing to land. The owed target is durable, so it is retried every 5s and survives restarts, and nothing else pages for it. Until the tree advances, the boundary withdrawal and every higher nonce cannot be released. Check the destination RPC, the signers, the fee payer balance and the database (a failed gate read also withholds it); the armed target is in indexer_state.owed_rotation_target."
        labels:
          severity: critical
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(private_channel_operator_transaction_errors_total{error_reason="rotation_not_landed"}[10m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [30]
              refId: C

      - uid: rotation-blocked-by-lower-nonce
        title: "Tree rotation withheld: a lower nonce still owes a release"
        condition: C
        for: 15m
        noDataState: OK
        execErrState: Error
        annotations:
          summary: "Operator {{ $labels.job }} ({{ $labels.program_type }}) is withholding a tree rotation because a withdrawal on the closing tree has not released yet. This is the safe outcome, not a fault: rotating would close the only tree that release can ever land on. The withheld nonce is in the sender log. Resolve that withdrawal, by releasing it or letting its remint finish, and the rotation proceeds on its own."
        labels:
          severity: warning
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: prometheus
            model:
              expr: increase(private_channel_operator_transaction_errors_total{error_reason="rotation_blocked_by_lower_nonce"}[10m])
              instant: true
              refId: A
          - refId: C
            relativeTimeRange:
              from: 0
              to: 0
            datasourceUid: __expr__
            model:
              type: threshold
              expression: A
              conditions:
                - evaluator:
                    type: gt
                    params: [30]
              refId: C
