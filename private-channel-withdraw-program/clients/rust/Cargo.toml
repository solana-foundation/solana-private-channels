[package]
name = "private-channel-withdraw-program-client"
version = "0.0.1"
edition = "2021"
description = "Rust client for the PrivateChannel Withdraw Program"
license = "MIT"
repository = "https://github.com/solana-foundation/solana-private-channels"

[dependencies]
borsh = { workspace = true }
solana-account-info = "3"
solana-pubkey = "4"
solana-instruction = "3"
solana-cpi = "3"
num-derive = { workspace = true }

solana-client = { version = "4.2", optional = true }
solana-account = { version = "4", optional = true }
num-traits = { workspace = true }

solana-program-error = "3"
thiserror = { workspace = true }

[features]
default = []
fetch = ["solana-client", "solana-account"]

[package.metadata.cargo-machete]
ignored = ["num-traits"]
