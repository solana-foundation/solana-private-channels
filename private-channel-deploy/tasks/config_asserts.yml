---
# Deployment config asserts; imported by deploy.yml and k3s.yml.

# compose_file treats anything but devnet/mainnet as localnet, so a typo would
# deploy the localnet stack without its validator assets.
- name: Assert network is a known cluster
  ansible.builtin.assert:
    that: network in ['localnet', 'devnet', 'mainnet']
    fail_msg: "network={{ network }} must be localnet, devnet or mainnet."

# The withdraw operator re-checks a Dead finality verdict against this fallback
# before reminting and refuses to start without one. localnet reuses the local
# validator via the compose file, so the var is only required off localnet.
- name: Assert archival fallback RPC is set off localnet
  ansible.builtin.assert:
    that: network == 'localnet' or (fallback_rpc_url | default('') | length > 0)
    fail_msg: |
      fallback_rpc_url is empty for network={{ network }}.
      The withdraw operator needs an independent, same-cluster archival Solana
      RPC to corroborate a Dead finality verdict and refuses to start without
      one. Set fallback_rpc_url to a provider independent from rpc_url.

# The node and the operator both need the delegate, with no fallback to the admin key:
# deriving it on each deploy would change the policed key whenever the admin key does.
- name: Assert the permanent delegate is set
  ansible.builtin.assert:
    that: permanent_delegate | default('') | length > 0
    fail_msg: |
      permanent_delegate is not set for network={{ network }}.
      Set it in vars/{{ network }}.yml to the base58 pubkey written into every
      channel mint as its permanent delegate: a dedicated key in production, or
      the channel admin pubkey for a dev stack.

- name: Assert each signer backend is known
  ansible.builtin.assert:
    that: lookup('vars', item ~ '_signer', default='memory') in signer_backend_vars
    fail_msg: "{{ item }}_signer={{ lookup('vars', item ~ '_signer', default='memory') }} must be memory, vault, turnkey or privy."
  loop: [ admin, operator ]

# Mirrors signer_util's read_role_spec, so a missing var fails here and not
# as a crash-looping operator.
- name: Assert every var the selected signer backends need is set
  vars:
    _needed: >-
      {{ (signer_backend_vars.get(admin_signer | default('memory'), []) | map('regex_replace', '^', 'admin_') | list)
       + (signer_backend_vars.get(operator_signer | default('memory'), []) | map('regex_replace', '^', 'operator_') | list) }}
  ansible.builtin.assert:
    that: lookup('vars', item, default='') | default('', true) | string | trim | length > 0
    fail_msg: >-
      {{ item }} is empty, but {{ item.split('_')[0] }}_signer={{ lookup('vars', item.split('_')[0] ~ '_signer') }}
      needs it. Set it in vars (plain values) or secrets.yml / Doppler (tokens and secrets).
    quiet: true
  loop: "{{ _needed }}"

# solana-keychain's Vault client is https-only, so any other address crash-loops the operator.
- name: Assert Vault signer addresses use https
  when: lookup('vars', item ~ '_signer', default='memory') == 'vault'
  ansible.builtin.assert:
    that: lookup('vars', item ~ '_vault_addr', default='') is match('https://')
    fail_msg: "{{ item }}_vault_addr must be an https:// URL: the Vault signer refuses plain http."
  loop: [ admin, operator ]

# The operator key alone can release escrow funds, so a hot key is refused
# outright on mainnet, wherever it is held.
- name: Refuse the memory signer on mainnet
  when: network == 'mainnet'
  ansible.builtin.assert:
    that: lookup('vars', item ~ '_signer', default='memory') != 'memory'
    fail_msg: >-
      mainnet refuses the memory signer for {{ item }}: its private key would sit on the
      host. Set {{ item }}_signer to vault, turnkey or privy.
  loop: [ admin, operator ]

- name: Refuse a keypair held in Doppler on mainnet
  when: network == 'mainnet'
  ansible.builtin.assert:
    that: ((_doppler_keypairs | default({}))[item] | default('')) | length == 0
    fail_msg: "mainnet refuses Doppler {{ item | upper }}_KEYPAIR: remove it and use a remote signer."
  loop: [ admin, operator ]

- name: Assert the admin and operator keys differ off localnet
  when: network != 'localnet'
  ansible.builtin.assert:
    that: pc_admin_pubkey | default('') != pc_operator_pubkey | default('')
    fail_msg: >-
      The admin and operator keys must differ off localnet (both are {{ pc_admin_pubkey | default('') }}).
      The withdraw operator signs releases with its own key so each can rotate alone.

- name: Warn when a memory operator sits beside a remote admin
  when:
  - network != 'mainnet'
  - operator_signer | default('memory') == 'memory'
  - admin_signer | default('memory') != 'memory'
  ansible.builtin.debug:
    msg: >-
      WARNING: operator_signer is memory while admin_signer is {{ admin_signer }}. The operator
      key alone can release escrow funds, so protect it at least as well as the admin key.

# Same rules as the gateway and auth apply at startup. No value is echoed.
- name: Assert jwt_secret_previous is usable when set
  when:
  - gateway_enforce_jwt | default(true) | bool
  - jwt_secret_previous | default('', true) | trim | length > 0
  ansible.builtin.assert:
    that:
    - jwt_secret | default('', true) | trim | length > 0
    - jwt_secret_previous | trim | length >= 32
    - jwt_secret_previous | trim != jwt_secret | default('', true) | trim
    fail_msg: >-
      jwt_secret_previous is refused: it needs a non-blank jwt_secret, at least 32 bytes after
      trimming, and a value different from jwt_secret. Stage a rotation with
      scripts/rotate-secret.sh jwt_secret, which sets both.

# Optional until an escrow account is configured; a malformed value would only
# surface as the indexer and operators refusing to start. The message never shows it.
- name: Assert escrow_confidential_keys has the shape the services load
  when: escrow_confidential_keys | default('') | trim | length > 0
  ansible.builtin.assert:
    # Regex only, so no parse error can echo the value; the services do the full parse.
    that:
    - escrow_confidential_keys | string | trim is match('^\\{.*\\}$')
    - escrow_confidential_keys | string is search('"elgamal_secret"\\s*:\\s*"[A-Za-z0-9+/=]+"')
    - escrow_confidential_keys | string is search('"aes_key"\\s*:\\s*"[A-Za-z0-9+/=]+"')
    fail_msg: escrow_confidential_keys is not JSON with base64 elgamal_secret and aes_key; regenerate it with confidential_keygen.

- name: Assert escrow_confidential_pubkey is a base64 pubkey with its keys set
  when: escrow_confidential_pubkey | default('') | trim | length > 0
  ansible.builtin.assert:
    that:
    - escrow_confidential_pubkey | string | trim is match('^[A-Za-z0-9+/]{43}=$')
    - escrow_confidential_keys | default('') | trim | length > 0
    fail_msg: escrow_confidential_pubkey must be the base64 pubkey confidential_keygen printed, and escrow_confidential_keys must be set with it.

- name: Assert program IDs equal the compiled ones
  ansible.builtin.assert:
    that:
    - escrow_program_id | default(compiled_escrow_program_id) == compiled_escrow_program_id
    - withdraw_program_id | default(compiled_withdraw_program_id) == compiled_withdraw_program_id
    fail_msg: |
      escrow_program_id / withdraw_program_id must equal the compiled program IDs
      ({{ compiled_escrow_program_id }} / {{ compiled_withdraw_program_id }}). They
      are fixed by declare_id! and compiled into the indexer and clients, so a
      different value here would be ignored. A custom ID needs rebuilt programs,
      images and clients. Fix: remove the override from vars/<env>.yml.
