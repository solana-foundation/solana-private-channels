name: Script Tests

concurrency:
  group: scripts-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Makefile and setup-solana install the solana-keygen the tests need.
on:
  push:
    branches: [main, hardening/pre-release-audit, hardening/cantina-reaudit]
    paths:
      - "scripts/**"
      - "versions.env"
      - "docker-compose*.yml"
      - ".env.*"
      - "private-channel-deploy/**"
      - "Makefile"
      - ".github/actions/setup-solana/**"
      - ".github/workflows/scripts-test.yml"
      # startup-config.test.sh ties these program IDs to declare_id!.
      - "private-channel-escrow-program/program/src/lib.rs"
      - "private-channel-withdraw-program/program/src/lib.rs"
      - "indexer/src/indexer/datasource/common/parser/escrow.rs"
      - "indexer/src/indexer/datasource/common/parser/withdraw.rs"
      - "core/src/bin/streamer.rs"
  pull_request:
    branches: [main, hardening/pre-release-audit, hardening/cantina-reaudit, audit/apex-audit-scan-remediation]
    paths:
      - "scripts/**"
      - "versions.env"
      - "docker-compose*.yml"
      - ".env.*"
      - "private-channel-deploy/**"
      - "Makefile"
      - ".github/actions/setup-solana/**"
      - ".github/workflows/scripts-test.yml"
      # startup-config.test.sh ties these program IDs to declare_id!.
      - "private-channel-escrow-program/program/src/lib.rs"
      - "private-channel-withdraw-program/program/src/lib.rs"
      - "indexer/src/indexer/datasource/common/parser/escrow.rs"
      - "indexer/src/indexer/datasource/common/parser/withdraw.rs"
      - "core/src/bin/streamer.rs"

permissions:
  contents: read

jobs:
  script-tests:
    name: Script Tests
    # Private-runner jobs skip fork PRs: that runner only runs code from this repo's branches.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: private-channel-runner-1
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # update-admin-env.test.sh needs solana-keygen.
      - name: Setup Solana CLI
        uses: ./.github/actions/setup-solana

      # reconcile-escrow-balance.test.sh needs jq.
      - name: Install jq
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }

      # ansible-preflight.test.sh runs the deploy playbook's config asserts.
      - name: Install ansible-core
        run: |
          command -v ansible-playbook >/dev/null && exit 0
          python3 -m venv "$RUNNER_TEMP/ansible" || {
            sudo apt-get update && sudo apt-get install -y python3-venv
            python3 -m venv "$RUNNER_TEMP/ansible"
          }
          "$RUNNER_TEMP/ansible/bin/pip" install --quiet 'ansible-core>=2.16'
          echo "$RUNNER_TEMP/ansible/bin" >> "$GITHUB_PATH"

      - name: Run script tests
        run: |
          for test_script in scripts/tests/*.test.sh; do
            echo "Running $test_script"
            bash "$test_script"
          done
