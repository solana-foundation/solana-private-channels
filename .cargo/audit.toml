# Advisories with no compatible fix. Each entry says why it does not reach a release binary
# or why it cannot be bumped yet. Revisit when the upstream crate moves.
[advisories]
ignore = [
    # curve25519-dalek 3 / ed25519-dalek 1 / idna 0.1: solana-runtime and jsonrpc client, tests only;
    # in the trident fuzz workspace via solana-sdk 2.x
    "RUSTSEC-2024-0344",
    "RUSTSEC-2022-0093",
    "RUSTSEC-2024-0421",
    # rsa: pulled in by jsonwebtoken, unused since every JWT key is an HMAC secret; no fix released
    "RUSTSEC-2023-0071",
    # crypto-bigint 0.5: via elliptic-curve 0.13 (k256, p256, p384), which Agave, jsonwebtoken and
    # solana-keychain pin. JWTs are HMAC; the only secret-key use is local P-256 request signing
    "RUSTSEC-2026-0387",
    # zstd 0.13 / zstd-safe 7: Agave pins zstd 0.13. Nothing calls `with_context`, the `seekable`
    # feature is off, and streams are only decoded through `read::Decoder`, which is unaffected
    "RUSTSEC-2026-0391",
    "RUSTSEC-2026-0398",
    "RUSTSEC-2026-0403",
]
