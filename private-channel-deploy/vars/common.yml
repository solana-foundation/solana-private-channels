# Shared defaults for every env. Per-env files override individual keys.
# Edit only when something is genuinely cross-env (a port the team agrees on,
# a new healthcheck timeout). Env-specific values belong in vars/<env>.yml.

# --- Layout on the host ---
# All deploy artifacts (compose.yml, .env, data dirs) live under host_data_dir.
# Override per-env if /opt isn't writable on the target.
host_data_dir: /opt/private-channel
# Marker file recording one-time bootstrap; bootstrap phase is skipped while present.
bootstrap_marker: "{{ host_data_dir }}/.bootstrapped"
# File holding the currently-deployed image tag, written at end of deploy phase.
deployed_tag_file: "{{ host_data_dir }}/.deployed-tag"

# --- Image source ---
# `image_registry` and `image_tag` are per-environment config and live in
# vars/<env>.yml (see vars/dev.yml). Common.yml provides no defaults so a
# missing var fails fast instead of silently falling back.

# Registry host of image_registry. GHCR login, the token scope check and the
# old GHCR entry cleanup only run when it is ghcr.io.
_registry_host: "{{ image_registry.split('/')[0] }}"

# --- Repo location ---
# Path on the control node containing docker-compose.yml + the files PHASE 3
# RENDER ships to the target (init scripts, indexer config, etc.).
repo_root: "{{ playbook_dir }}/.."

# --- Compose stack selection ---
# Path to the compose file relative to repo_root. Selected automatically by `network`:
#   localnet         -> docker-compose.yml          (bundled validator)
#   devnet / mainnet -> docker-compose.devnet.yml   (talks to external Solana RPC)
# Override per-env if you ship a custom compose file.
compose_file: "{{ 'docker-compose.devnet.yml' if network | default('localnet') in ['devnet', 'mainnet'] else 'docker-compose.yml' }}"
# Compose services to bring up. The base list runs on every cluster; `validator`
# is appended only on localnet (devnet/mainnet use real Solana RPC, no local
# validator container). Override compose_services per-env if you need a custom
# subset. With gateway_enforce_jwt the gateway reads the auth schema, so auth runs too.
compose_services_base: "postgres-primary postgres-replica write-node read-node gateway postgres-indexer indexer-private-channel pg-backup-primary pg-backup-indexer"
# These refuse to start without an escrow instance, so PHASE 1 leaves them out of a
# localnet first boot that has none (`_workers_enabled`).
compose_services_workers: "indexer-solana operator-solana operator-private-channel"
compose_services: "{{ compose_services_base }}{{ ' auth-migrate auth' if (gateway_enforce_jwt | default(true) | bool) else '' }}{{ (' ' ~ compose_services_workers) if (_workers_enabled | default(true) | bool) else '' }}{{ ' validator' if network | default('localnet') == 'localnet' else '' }}"

# --- Program IDs ---
# Fixed by each program's declare_id! and compiled into the indexer and clients, so
# they are not deploy config. A custom ID needs rebuilt programs, images and clients;
# PHASE 1 refuses an escrow_program_id / withdraw_program_id override that differs.
compiled_escrow_program_id: 9tgHa1DcnaSSUtmMsst8ovKTe1Gfxzezn27KnH9xXYeU
compiled_withdraw_program_id: J231K9UEpS4y4KAPwGc4gsMNCjKFRMYcQBcjVW7vBhVi

# Host interface the monitoring ports bind to. Loopback by default, matching the
# raw compose stack: Grafana's datasource reads the indexer database, so an
# unprotected port there is a data exposure, not just an ops inconvenience.
# Reach it over an SSH tunnel:
#   ssh -L 3001:127.0.0.1:{{ monitoring_grafana_port }} <host>
# Set to "" (empty) in vars/<env>.yml to publish on every interface instead. Only
# do that behind a reverse proxy with TLS and a network allowlist.
monitoring_bind_address: "127.0.0.1:"

# --- Signers -----------------------------------------------------------------
# Backend per role: memory, vault, turnkey or privy. memory loads the key from
# <role>_keypair_path (or Doppler <ROLE>_KEYPAIR); mainnet refuses it. Remote
# backends need <role>_pubkey plus the vars below; secrets among them (vault
# token, turnkey API private key, privy app secret) go in secrets.yml or Doppler.
admin_signer: memory
operator_signer: memory
# Extra channel admin pubkeys the node accepts, for the admin rotation overlap.
extra_admin_keys: []
# Vars each backend needs, per role (prefixed with admin_ or operator_).
signer_backend_vars:
  memory: []
  vault: [ vault_addr, vault_token, vault_key_name, pubkey ]
  turnkey: [ turnkey_api_public_key, turnkey_api_private_key, turnkey_organization_id, turnkey_private_key_id, pubkey ]
  privy: [ privy_app_id, privy_app_secret, privy_wallet_id, pubkey ]

# --- Secret files ------------------------------------------------------------
# Every secret a container needs, per service directory under
# {{ host_data_dir }}/secrets/. Each container mounts only its own directory at
# /run/secrets and reads KEY from the file KEY (the app image entrypoint turns
# KEY_FILE into KEY; postgres and Grafana read files natively). An empty value
# gets no file and no KEY_FILE, so the base compose default applies.
# The rendered .env keeps these keys present but empty.
_pc_remote_rpc: "{{ network | default('localnet') != 'localnet' }}"
_pc_indexer_db_url: "postgres://{{ postgres_indexer_user }}:{{ postgres_indexer_password }}@postgres-indexer:5432/{{ postgres_indexer_db }}"
# The one secret each signer backend needs, as the env key suffix and its deploy var.
_pc_signer_secret:
  memory: { key: PRIVATE_KEY, var: pc_ROLE_private_key }
  vault: { key: VAULT_TOKEN, var: ROLE_vault_token }
  turnkey: { key: TURNKEY_API_PRIVATE_KEY, var: ROLE_turnkey_api_private_key }
  privy: { key: PRIVY_APP_SECRET, var: ROLE_privy_app_secret }
secret_files:
  postgres-primary:
  - { key: POSTGRES_PASSWORD, value: "{{ postgres_password }}" }
  - { key: POSTGRES_REPLICATION_PASSWORD, value: "{{ postgres_replication_password }}" }
  - { key: POSTGRES_RUNTIME_PASSWORD, value: "{{ postgres_runtime_password }}" }
  - { key: POSTGRES_AUTH_RUNTIME_PASSWORD, value: "{{ postgres_auth_runtime_password }}" }
  - { key: POSTGRES_AUTH_OWNER_PASSWORD, value: "{{ postgres_auth_owner_password }}" }
  - { key: POSTGRES_GATEWAY_PASSWORD, value: "{{ postgres_gateway_password }}" }
  - { key: POSTGRES_MONITORING_PASSWORD, value: "{{ postgres_monitoring_password }}" }
  postgres-replica:
  - { key: POSTGRES_PASSWORD, value: "{{ postgres_password }}" }
  - { key: POSTGRES_REPLICATION_PASSWORD, value: "{{ postgres_replication_password }}" }
  postgres-indexer:
  - { key: POSTGRES_PASSWORD, value: "{{ postgres_indexer_password }}" }
  - { key: POSTGRES_GRAFANA_PASSWORD, value: "{{ postgres_grafana_password }}" }
  write-node:
  - { key: PRIVATE_CHANNEL_ACCOUNTSDB_CONNECTION_URL, value: "postgres://private_channel_runtime:{{ postgres_runtime_password }}@postgres-primary:5432/{{ postgres_db }}" }
  read-node:
  - { key: PRIVATE_CHANNEL_ACCOUNTSDB_CONNECTION_URL, value: "postgres://private_channel_runtime:{{ postgres_runtime_password }}@postgres-replica:5432/{{ postgres_db }}" }
  gateway:
  - { key: JWT_SECRET, value: "{{ jwt_secret if (gateway_enforce_jwt | default(true) | bool) else '' }}" }
  - { key: JWT_SECRET_PREVIOUS, value: "{{ jwt_secret_previous | default('', true) if (gateway_enforce_jwt | default(true) | bool) else '' }}" }
  - { key: AUTH_DATABASE_URL, value: "postgres://private_channel_gateway:{{ postgres_gateway_password }}@postgres-primary:5432/{{ postgres_db }}" }
  - { key: GATEWAY_WHITELIST_RPC_URL, value: "{{ gateway_whitelist_rpc_url | default('') }}" }
  auth-migrate:
  - { key: AUTH_DATABASE_URL, value: "postgres://private_channel_auth_owner:{{ postgres_auth_owner_password }}@postgres-primary:5432/{{ postgres_db }}" }
  auth:
  - { key: AUTH_DATABASE_URL, value: "postgres://private_channel_auth_runtime:{{ postgres_auth_runtime_password }}@postgres-primary:5432/{{ postgres_db }}" }
  - { key: JWT_SECRET, value: "{{ jwt_secret if (gateway_enforce_jwt | default(true) | bool) else '' }}" }
  - { key: JWT_SECRET_PREVIOUS, value: "{{ jwt_secret_previous | default('', true) if (gateway_enforce_jwt | default(true) | bool) else '' }}" }
  indexer-solana:
  - { key: DATABASE_URL, value: "{{ _pc_indexer_db_url }}" }
  - { key: COMMON_RPC_URL, value: "{{ rpc_url if (_pc_remote_rpc | bool) else '' }}" }
  - { key: COMMON_FALLBACK_RPC_URL, value: "{{ fallback_rpc_url | default('') if (_pc_remote_rpc | bool) else '' }}" }
  - { key: INDEXER_BACKFILL_RPC_URL, value: "{{ rpc_url if (_pc_remote_rpc | bool) else '' }}" }
  - { key: INDEXER_YELLOWSTONE_TOKEN, value: "{{ yellowstone_token | default('') if (_pc_remote_rpc | bool) else '' }}" }
  - { key: ALERT_WEBHOOK_URL, value: "{{ notify_webhook | default('') }}" }
  indexer-private-channel:
  - { key: DATABASE_URL, value: "{{ _pc_indexer_db_url }}" }
  - { key: ALERT_WEBHOOK_URL, value: "{{ notify_webhook | default('') }}" }
  operator-solana: "{{ _pc_operator_solana_secrets + _pc_signer_secrets_admin }}"
  operator-private-channel: "{{ _pc_operator_pc_secrets + _pc_signer_secrets_admin + _pc_signer_secrets_operator }}"
  pg-backup-primary:
  - { key: PGPASSWORD, value: "{{ postgres_replication_password }}" }
  pg-backup-indexer:
  - { key: PGPASSWORD, value: "{{ postgres_indexer_password }}" }
  # Only in the localnet compose file.
  streamer:
  - { key: STREAMER_ACCOUNTSDB_CONNECTION_URL, value: "{{ '' if (_pc_remote_rpc | bool) else 'postgres://private_channel_runtime:' ~ postgres_runtime_password ~ '@postgres-replica:5432/' ~ postgres_db }}" }
  - { key: STREAMER_DATABASE_URL, value: "{{ '' if (_pc_remote_rpc | bool) else _pc_indexer_db_url }}" }
  # Monitoring stack (monitoring.compose.yml).
  mon-grafana:
  - { key: GF_SECURITY_ADMIN_PASSWORD, value: "{{ grafana_admin_password }}" }
  - { key: POSTGRES_GRAFANA_PASSWORD, value: "{{ postgres_grafana_password }}" }
  - { key: ALERT_WEBHOOK_URL, value: "{{ alert_webhook_url | default('http://localhost:9/no-op', true) }}" }
  mon-pgexp-primary:
  - { key: DATA_SOURCE_PASS, value: "{{ postgres_monitoring_password }}" }
  mon-pgexp-indexer:
  - { key: DATA_SOURCE_PASS, value: "{{ postgres_indexer_password }}" }
# Secrets that need a restart to take effect feed a service's secrets-rev; a service not
# listed uses all of its secrets. Postgres uses its passwords only at initdb (the deploy
# applies changes by ALTER ROLE and the replica passfile), and the replica re-reads its
# files from the live mount on each start. Grafana's admin password is reset by grafana-cli.
secrets_rev_keys:
  postgres-primary: []
  postgres-indexer: []
  postgres-replica: []
  mon-grafana: [ POSTGRES_GRAFANA_PASSWORD, ALERT_WEBHOOK_URL ]
_pc_operator_solana_secrets:
  - { key: DATABASE_URL, value: "{{ _pc_indexer_db_url }}" }
  - { key: COMMON_SOURCE_RPC_URL, value: "{{ rpc_url if (_pc_remote_rpc | bool) else '' }}" }
  - { key: ALERT_WEBHOOK_URL, value: "{{ notify_webhook | default('') }}" }
  - { key: OPERATOR_RECONCILIATION_WEBHOOK_URL, value: "{{ notify_webhook | default('') }}" }
_pc_operator_pc_secrets:
  - { key: DATABASE_URL, value: "{{ _pc_indexer_db_url }}" }
  - { key: COMMON_RPC_URL, value: "{{ rpc_url if (_pc_remote_rpc | bool) else '' }}" }
  - { key: COMMON_FALLBACK_RPC_URL, value: "{{ fallback_rpc_url | default('') if (_pc_remote_rpc | bool) else '' }}" }
  - { key: ALERT_WEBHOOK_URL, value: "{{ notify_webhook | default('') }}" }
_pc_signer_secrets_admin:
  - key: "ADMIN_{{ _pc_signer_secret[admin_signer | default('memory')].key }}"
    value: "{{ lookup('vars', _pc_signer_secret[admin_signer | default('memory')].var | replace('ROLE', 'admin'), default='') }}"
_pc_signer_secrets_operator:
  - key: "OPERATOR_{{ _pc_signer_secret[operator_signer | default('memory')].key }}"
    value: "{{ lookup('vars', _pc_signer_secret[operator_signer | default('memory')].var | replace('ROLE', 'operator'), default='') }}"

# --- Ports (host-side) — read by health probes ---
gateway_port: 8899
write_port: 8900
read_port: 8901
streamer_port: 8902
auth_port: 8903
# Not host-side: the gateway's internal listener is never published, so it has
# no health probe. Compose services reach it as http://gateway:<this>.
gateway_internal_port: 8904

# --- Gateway tuning ---
# Max seconds one forwarded request may wait on the write or read node (1 to 3600).
gateway_upstream_timeout_secs: 30
# Max public reads in flight to the read node; must stay below the gateway's 1024 max connections.
gateway_max_forwarded_reads: 768
# Max Mainnet reads per second the withdraw whitelist check makes; past it, withdrawals go unchecked.
gateway_whitelist_reads_per_second: 20

# --- Health phase tuning ---
# Per-service probe budget. With backoff inside the retry loop this gives
# ~30s of hysteresis per service before the phase fails.
health_retries: 15
health_delay: 2

# --- Postgres defaults (passwords come from secrets.yml) ---
postgres_db: private_channel
postgres_user: private_channel
postgres_indexer_db: indexer
# The indexer cluster's own superuser, never postgres_user: those processes can
# reach postgres-primary, so a shared credential would carry the auth tables.
postgres_indexer_user: private_channel_indexer
postgres_replication_user: replicator

# --- Reset-state default ---
# Each per-env file overrides this. Default to `false` so that any new env
# someone adds without thinking about it is non-destructive — they have to
# opt in explicitly. See vars/dev.yml for the rationale.
reset_state: false

# --- Validator ledger reset ---
# Controls VALIDATOR_RESET_FLAG in the rendered .env (localnet bundled validator).
# Default `true`: boot with `--reset` from genesis on every redeploy, which the
# indexer's startup reconciliation depends on (see the RESET_STATE rationale in
# deploy.yml). Set `false` to preserve the validator ledger across redeploys —
# the deploy analogue of `make docker-up-persist`. Only safe when Postgres is
# NOT wiped in lockstep, or the indexer will reconcile stale rows against an
# empty chain.
validator_reset: true

# --- Archival RPC fallback ---
# Cross-env default for the archival Solana RPC that re-checks a Dead finality
# verdict. Empty by default; REQUIRED off localnet (set per-env in vars/<env>.yml)
# since the withdraw operator refuses to start without it.
fallback_rpc_url: ""

# --- Optional notification webhook posted from the report phase ---
# A secret: set it in secrets.yml or Doppler, never in a vars file.
notify_webhook: ""

# --- Grafana alerting contact point (vendor-neutral by default) ------------
# Leave at the defaults for a no-op (alerting evaluates but notifies nowhere).
# To enable, set alert_contact_type here (e.g. slack) and alert_webhook_url in
# secrets.yml or Doppler (GRAFANA_ALERT_WEBHOOK_URL). Both webhooks are secrets;
# only these no-op defaults live in vars.
alert_contact_type: "webhook"
alert_webhook_url: "http://localhost:9/no-op"
# External URL Grafana uses when generating links (alert notifications, share
# links). Defaults to localhost; override per stack with the box's reachable
# Grafana address, e.g. grafana_root_url: "http://<external-ip>:3001".
grafana_root_url: "http://localhost:3000"

# --- Build-arg pins, mirrored from versions.env so renders stay reproducible ---
# Shipped to the target during PHASE 3 RENDER and passed to compose via --env-file.
versions_env_file: "{{ repo_root }}/versions.env"

# --- Target-side paths -----------------------------------------------------
# PHASE 3 RENDER copies the compose file + versions.env from the control node
# into target_config_dir on every target. Pull/up/down then reference these
# target-side paths so the playbook works against a remote host that doesn't
# have the repo. Local builds still use the repo paths above.
target_config_dir: "{{ host_data_dir }}/config"
target_compose_file: "{{ target_config_dir }}/{{ compose_file }}"
target_versions_env_file: "{{ target_config_dir }}/versions.env"
target_override_file: "{{ target_config_dir }}/compose.override.yml"

# --- Image signature verification (opt-in; see verify_image_signature) --------
# verify_image_signature gates the cosign preflight check. Off here so existing
# stacks are unaffected; set `verify_image_signature: true` in a stack's vars to
# require a signed image. image_signer_identity is the cosign
# --certificate-identity-regexp the image must have been signed by: our publish
# workflow on main or a release tag.
verify_image_signature: false
image_signer_identity: '^https://github\.com/solana-foundation/solana-private-channels/\.github/workflows/publish-image\.yml@refs/(heads/main|tags/.*)$'
