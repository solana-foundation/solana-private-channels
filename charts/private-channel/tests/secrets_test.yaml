suite: secret mount contract
templates:
  - templates/workloads.yaml
  - templates/auth-migrate-job.yaml
set:
  secretKeys:
    write-node: [ PRIVATE_CHANNEL_ACCOUNTSDB_CONNECTION_URL ]
    gateway: [ JWT_SECRET, AUTH_DATABASE_URL ]
    auth-migrate: [ AUTH_DATABASE_URL ]
    operator-private-channel: [ DATABASE_URL, ADMIN_PRIVATE_KEY, OPERATOR_PRIVATE_KEY ]
tests:
  - it: sets KEY_FILE for each of the service's keys
    template: templates/workloads.yaml
    documentSelector: { path: metadata.name, value: gateway }
    asserts:
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: JWT_SECRET_FILE, value: /run/secrets/JWT_SECRET } }
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: AUTH_DATABASE_URL_FILE, value: /run/secrets/AUTH_DATABASE_URL } }
  - it: gives another service none of them
    template: templates/workloads.yaml
    documentSelector: { path: metadata.name, value: read-node }
    asserts:
      - notContains: { path: "spec.template.spec.containers[0].env", content: { name: JWT_SECRET_FILE, value: /run/secrets/JWT_SECRET } }
      - notExists: { path: spec.template.spec.volumes }
  - it: mounts the whole Secret at /run/secrets with mode 0440 and never subPath
    template: templates/workloads.yaml
    documentSelector: { path: metadata.name, value: write-node }
    asserts:
      - contains: { path: spec.template.spec.volumes, content: { name: secrets, secret: { secretName: pc-write-node, defaultMode: 288 } } }
      - contains: { path: "spec.template.spec.containers[0].volumeMounts", content: { name: secrets, mountPath: /run/secrets, readOnly: true } }
  - it: runs as the image user, non-root, with fsGroup 1000
    template: templates/workloads.yaml
    documentSelector: { path: metadata.name, value: write-node }
    asserts:
      - equal: { path: spec.template.spec.securityContext.runAsNonRoot, value: true }
      - equal: { path: spec.template.spec.securityContext.runAsUser, value: 1000 }
      - equal: { path: spec.template.spec.securityContext.fsGroup, value: 1000 }
      - equal: { path: spec.template.spec.automountServiceAccountToken, value: false }
  - it: gives auth-migrate only the owner URL
    template: templates/auth-migrate-job.yaml
    asserts:
      - contains: { path: "spec.template.spec.containers[0].env", content: { name: AUTH_DATABASE_URL_FILE, value: /run/secrets/AUTH_DATABASE_URL } }
      - equal: { path: "spec.template.spec.volumes[0].secret.secretName", value: pc-auth-migrate }
  - it: references the pull secret on our images
    template: templates/workloads.yaml
    documentSelector: { path: metadata.name, value: write-node }
    asserts:
      - contains: { path: spec.template.spec.imagePullSecrets, content: { name: pc-ghcr } }
