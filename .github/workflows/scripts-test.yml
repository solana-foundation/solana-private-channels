name: Script Tests

concurrency:
  group: scripts-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Makefile and setup-solana install the solana-keygen the tests need.
on:
  push:
    branches: [main, hardening/pre-release-audit, hardening/cantina-reaudit]
    paths:
      - "scripts/**"
      - "versions.env"
      - "docker-compose*.yml"
      - ".env.*"
      - "private-channel-deploy/**"
      - "Makefile"
      - ".github/actions/setup-solana/**"
      - ".github/workflows/scripts-test.yml"
  pull_request:
    branches: [main, hardening/pre-release-audit, hardening/cantina-reaudit, audit/apex-audit-scan-remediation]
    paths:
      - "scripts/**"
      - "versions.env"
      - "docker-compose*.yml"
      - ".env.*"
      - "private-channel-deploy/**"
      - "Makefile"
      - ".github/actions/setup-solana/**"
      - ".github/workflows/scripts-test.yml"

permissions:
  contents: read

jobs:
  script-tests:
    name: Script Tests
    # Private-runner jobs skip fork PRs: that runner only runs code from this repo's branches.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: private-channel-runner-1
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # update-admin-env.test.sh needs solana-keygen.
      - name: Setup Solana CLI
        uses: ./.github/actions/setup-solana

      # reconcile-escrow-balance.test.sh needs jq.
      - name: Install jq
        run: command -v jq >/dev/null || { sudo apt-get update && sudo apt-get install -y jq; }

      - name: Run script tests
        run: |
          for test_script in scripts/tests/*.test.sh; do
            echo "Running $test_script"
            bash "$test_script"
          done
