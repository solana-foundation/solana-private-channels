---
# Pure computation, no cluster: the per-service secret sets, their key names (for the
# chart) and the salted secrets-rev hashes. Needs _k3s_salt. The contract tests import it.
- name: Build the per-service secret sets
  ansible.builtin.set_fact:
    _k3s_sets: >-
      {%- set d = {} -%}
      {%- for svc, src in k3s_secret_services.items() -%}
      {%- if src in secret_files
            and (svc != 'streamer' or network == 'localnet')
            and (svc not in ['auth', 'auth-migrate'] or (gateway_enforce_jwt | default(true) | bool)) -%}
      {%- set _ = d.update({svc: secret_files[src] | selectattr('value') | list}) -%}
      {%- endif -%}
      {%- endfor -%}{{ d }}
  no_log: true

# Same formula as compose: the salted hash of exactly the restart-relevant values.
- name: Compute the secrets-rev hash and key names per service
  vars:
    _rev_keys: "{{ secrets_rev_keys | combine(k3s_secrets_rev_keys) }}"
  ansible.builtin.set_fact:
    _k3s_secrets_rev: >-
      {% set d = {} %}{% for svc, items in _k3s_sets.items() %}{% set src = k3s_secret_services[svc] %}{% set kv = [] %}{% for i in items if i.key in _rev_keys.get(src, [i.key]) %}{% set _ = kv.append(i.key ~ '=' ~ i.value) %}{% endfor %}{% set _ = d.update({svc: (_k3s_salt ~ '\n' ~ (kv | join('\n'))) | hash('sha256')}) %}{% endfor %}{{ d }}
    _k3s_secret_keys: "{{ dict(_k3s_sets.keys() | zip(_k3s_sets.values() | map('map', attribute='key') | map('list'))) }}"
  no_log: true

# Grafana is installed from the host (kps), so its hash is applied there; same formula.
- name: Compute Grafana's secrets-rev and admin hashes
  vars:
    _g: "{{ dict(secret_files['mon-grafana'] | map(attribute='key') | zip(secret_files['mon-grafana'] | map(attribute='value'))) }}"
    _gk: "{{ k3s_secrets_rev_keys['mon-grafana'] }}"
  ansible.builtin.set_fact:
    _k3s_grafana_rev: "{{ (_k3s_salt ~ '\n' ~ (_gk | map('regex_replace', '^(.*)$', '\\1=') | zip(_gk | map('extract', _g)) | map('join') | join('\n'))) | hash('sha256') }}"
    _k3s_grafana_admin_rev: "{{ (_k3s_salt ~ '\nadmin=' ~ _g.GF_SECURITY_ADMIN_PASSWORD) | hash('sha256') }}"
  no_log: true

