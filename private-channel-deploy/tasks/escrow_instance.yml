---
# Escrow instance resolution from pc_previous_instance_id; imported by deploy.yml and k3s.yml.

# The validator ledger is wiped when it boots with --reset, or when this run's reset_state
# phase deletes its volume. A run whose tags skip that phase wipes nothing.
- name: Decide whether this run wipes the localnet ledger
  ansible.builtin.set_fact:
    _localnet_ledger_wiped: >-
      {{ network == 'localnet' and (validator_reset | default(true) | bool
         or (reset_state | default(false) | bool
             and ('all' in ansible_run_tags or 'reset_state' in ansible_run_tags)
             and 'reset_state' not in ansible_skip_tags)) }}

- name: Set escrow_instance_id_pda from existing .env if present and non-placeholder
  when:
  - not (_localnet_ledger_wiped | bool)
  - pc_previous_instance_id | default('') | trim | length > 0
  - pc_previous_instance_id | trim != '11111111111111111111111111111111'
  - escrow_instance_id_pda is not defined
  ansible.builtin.set_fact:
    escrow_instance_id_pda: "{{ pc_previous_instance_id | trim }}"

# Same precedence as env.j2: the explicit var wins over the preserved PDA.
- name: Resolve the instance the workers will run against
  ansible.builtin.set_fact:
    _escrow_instance: "{{ (escrow_instance_id | default('', true) or escrow_instance_id_pda | default('')) | trim }}"

- name: Refuse the all-ones placeholder instance
  ansible.builtin.assert:
    that: _escrow_instance != '11111111111111111111111111111111'
    fail_msg: |
      escrow_instance_id is the all-ones placeholder (the system program). The
      indexer and operators refuse it. Create the instance (create_instance in
      scripts/devnet) and set escrow_instance_id to its address.

- name: Refuse a named instance that a localnet reset is about to wipe
  when: _localnet_ledger_wiped | bool
  ansible.builtin.assert:
    that: escrow_instance_id | default('', true) | length == 0
    fail_msg: |
      escrow_instance_id={{ escrow_instance_id | default('') }} but a localnet reset wipes the
      validator, and with it that instance. Either unset escrow_instance_id (the stack
      comes up without the workers) or pass -e reset_state=false -e validator_reset=false.

- name: Require an escrow instance off localnet
  ansible.builtin.assert:
    that: network == 'localnet' or _escrow_instance | length > 0
    fail_msg: |
      No escrow instance for network={{ network }}: escrow_instance_id is unset and
      no previous .env holds a COMMON_ESCROW_INSTANCE_ID. The indexer and operators
      refuse to start without it. Fix: create the instance first (create_instance in
      scripts/devnet), then set escrow_instance_id in vars/<env>.yml. An .env from an
      older render keeps it on an ESCROW_INSTANCE_ID line, which is no longer read.

# A localnet first boot has no instance (the validator starts empty), so the
# workers would only crash-loop and abort `up --wait`.
- name: Deploy the workers only when there is an instance
  ansible.builtin.set_fact:
    _workers_enabled: "{{ _escrow_instance | length > 0 }}"

- name: Report the services to deploy
  ansible.builtin.debug:
    msg: "compose_services: {{ compose_services }}"

- name: Explain the localnet first boot
  when: not (_workers_enabled | bool)
  ansible.builtin.debug:
    msg: >-
      No escrow instance yet, so indexer-solana, operator-solana and
      operator-private-channel are not deployed. Create the instance on the
      validator, run add_operator for {{ pc_operator_pubkey | default('the withdraw operator') }},
      set escrow_instance_id, and redeploy with
      -e reset_state=false -e validator_reset=false.
